[package]
name = "geometric-crypto"
version = "1.0.0"
edition = "2021"
authors = ["Jules <jules@example.com>"] # Placeholder author
description = "Geometric Coordinate Cryptographic System"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/geometric-crypto" # Placeholder repo
documentation = "https://docs.rs/geometric-crypto" # Placeholder docs
keywords = ["cryptography", "compression", "geometry", "security"]
categories = ["cryptography", "compression", "mathematics"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
blake3 = "1.3"
byteorder = "1.0" # Added byteorder
# Use the correct crate name for chacha20, which is typically `chacha20`
# The original issue doc had `chacha20 = "0.9"` which implies the crate name `chacha20`.
# rand_core is often a transitive dependency or part of a larger rand prelude.
# For ChaCha20Rng, the `chacha20` crate itself is usually sufficient, along with `rand_core` for traits.
# Let's ensure `rand_core` is explicitly listed if direct use of its traits (like SeedableRng) is needed,
# though often the primary RNG crate (like `chacha20`) re-exports or handles this.
# The `chacha20` crate version 0.9.x depends on `rand_core` 0.6.x.
chacha20 = "0.9" # Removed "rng" feature, assuming it's incorrect or default
rand = "0.8" # For general random utilities if needed, ChaCha20 specific seeding is handled by the chacha20 crate
rand_core = { version = "0.6", features = ["std"] } # Explicitly for SeedableRng, RngCore if not covered
rand_chacha = "0.3.1" # Added rand_chacha dependency
rayon = { version = "1.7", optional = true } # Made optional for feature 'parallel'
lru = "0.10.0" # The original doc had 0.10, common versions are 0.7, 0.8, 0.12. Let's use a recent one like 0.12.0
# For lru, let's use a version that is commonly available and stable. 0.12.1 is recent.
# However, the issue specified 0.10. If it's a strict requirement, use that. Let's stick to 0.10 as per doc for now.
# Rechecking common versions, 0.10.0 for lru is valid.
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
criterion = { version = "0.4", features = ["html_reports"], optional = true } # Moved from dev-dependencies for feature 'benchmark'

[dev-dependencies]
proptest = "1.0" # proptest 1.4.0 is recent
tempfile = "3.0" # tempfile 3.8.0 is recent
serde_json = "1.0" # For testing serde serialization

# Sticking to specified versions:
# criterion = { version = "0.4", features = ["html_reports"] }
# proptest = "1.0"
# tempfile = "3.0"


[features]
default = ["parallel", "compression", "network"]
parallel = ["rayon"]
compression = [] # No specific deps listed for this feature alone yet
network = ["tokio/net"]
benchmark = ["criterion"] # For enabling benchmark-specific code/dependencies

# Benchmark targets - these will be linked to files in benches/
# [[bench]]
# name = "compression_benchmarks"
# harness = false

# [[bench]]
# name = "security_benchmarks"
# harness = false

# [[bench]]
# name = "network_benchmarks"
# harness = false

